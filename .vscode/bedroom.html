<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Architectural Bedroom — Procedural Three.js Scene (1 unit = 1m)</title>
  <style>
    :root {
      --bg-panel: rgba(20, 20, 24, 0.88);
      --bg-item: rgba(255, 255, 255, 0.06);
      --bg-item-hover: rgba(255, 255, 255, 0.13);
      --accent: #d4a359;
      --accent-burgundy: #8e243d;
      --text-main: #f3f1ed;
      --text-muted: #9e9b95;
      --border: rgba(255, 255, 255, 0.12);
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111114;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 12px;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Top Toolbar */
    #top-bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 304px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .group-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-right: 4px;
      font-weight: 600;
    }

    button, .toggle-chip {
      background: var(--bg-item);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      padding: 5px 9px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    button:hover, .toggle-chip:hover {
      background: var(--bg-item-hover);
      border-color: rgba(255, 255, 255, 0.22);
    }

    button.active, .toggle-chip.active {
      background: var(--accent-burgundy);
      border-color: var(--accent);
      color: #fff;
    }

    button.export-btn {
      background: rgba(212, 163, 89, 0.2);
      border-color: var(--accent);
      color: #ffdca8;
      font-weight: 600;
    }

    button.export-btn:hover {
      background: rgba(212, 163, 89, 0.35);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }

    input[type="range"] {
      accent-color: var(--accent);
      width: 95px;
      cursor: pointer;
    }

    /* Blender-style Right Sidebar */
    #sidebar {
      position: fixed;
      top: 12px;
      right: 12px;
      bottom: 12px;
      width: 280px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #inspector {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.55;
      min-height: 148px;
    }

    .prop-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
    }

    .prop-key {
      color: var(--text-muted);
    }

    .prop-val {
      color: var(--text-main);
      font-weight: 600;
      text-align: right;
    }

    #outliner-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 12px 8px;
    }

    .tree-group {
      margin-bottom: 3px;
    }

    .tree-header {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      color: #e5e1d8;
    }

    .tree-header:hover {
      background: var(--bg-item-hover);
    }

    .tree-children {
      padding-left: 14px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      margin-left: 8px;
    }

    .tree-children.collapsed {
      display: none;
    }

    .tree-item {
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .tree-item:hover {
      background: var(--bg-item-hover);
      color: var(--text-main);
    }

    .tree-item.selected, .tree-header.selected {
      background: var(--accent-burgundy);
      color: #fff;
    }

    /* Walk Mode HUD */
    #walk-hud {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-panel);
      border: 1px solid var(--accent);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 20;
    }

    #walk-hud.visible {
      opacity: 1;
    }

    /* 3D Dimension Labels Overlay */
    #labels-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .dim-label {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(15, 15, 18, 0.86);
      border: 1px solid var(--accent);
      color: #fff5e4;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* Crosshair for Walk Mode */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -4px;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      pointer-events: none;
      display: none;
      z-index: 25;
    }
  </style>

<!-- Pinned Three.js r160 CDN Import Map (jsDelivr Multi-CDN) -->

</head>
<body>
  <div id="canvas-container"></div>
  <div id="labels-container"></div>
  <div id="crosshair"></div>
  <div id="walk-hud">WALK MODE (Eye 1.65m) — <b>WASD / Arrows</b> to move, <b>Mouse</b> to look, <b>ESC</b> to exit</div>

  <!-- Top Controls -->
  <div id="top-bar">
    <div class="toolbar-group">
      <span class="group-label">Camera</span>
      <button data-cam="overview" class="active">Overview</button>
      <button data-cam="bed">Bed</button>
      <button data-cam="desk">Desk</button>
      <button data-cam="window">Window</button>
      <button data-cam="mirror">Mirror</button>
      <button data-cam="top">Top-Down Plan</button>
    </div>

    <div class="toolbar-group">
      <span class="group-label">Modes</span>
      <button id="btn-walk">Walk (1.65m)</button>
      <button id="btn-outfit">Outfit-Check (Mirror)</button>
    </div>

    <div class="toolbar-group">
      <span class="group-label">Toggles</span>
      <button id="tog-ceiling" class="toggle-chip">Ceiling</button>
      <button id="tog-grid" class="toggle-chip">Grid</button>
      <button id="tog-wire" class="toggle-chip">Wireframe</button>
      <button id="tog-dims" class="toggle-chip">Dimensions</button>
      <button id="tog-human" class="toggle-chip">1.75m Figure</button>
      <button id="tog-sway" class="toggle-chip active">Plant Sway</button>
    </div>

    <div class="toolbar-group">
      <div class="slider-wrap">
        <span class="group-label">Time</span>
        <input type="range" id="time-slider" min="6" max="22" step="0.1" value="9.2" />
        <span id="time-readout" style="font-family: var(--font-mono); width: 42px;">09:12</span>
      </div>
    </div>

    <div class="toolbar-group">
      <button id="btn-export" class="export-btn">Export GLB</button>
    </div>
  </div>

  <!-- Right Blender-Style Outliner & Inspector -->
  <aside id="sidebar">
    <div class="panel-header">
      <span>Object Inspector</span>
      <span style="font-size:10px; color:var(--text-muted)">1u = 1.00m</span>
    </div>
    <div id="inspector">
      <div class="prop-row"><span class="prop-key">Selected</span><span class="prop-val" id="insp-name">None (Click Object)</span></div>
      <div class="prop-row"><span class="prop-key">Group Path</span><span class="prop-val" id="insp-path">—</span></div>
      <div class="prop-row"><span class="prop-key">Width (X)</span><span class="prop-val" id="insp-w">—</span></div>
      <div class="prop-row"><span class="prop-key">Depth (Z)</span><span class="prop-val" id="insp-d">—</span></div>
      <div class="prop-row"><span class="prop-key">Height (Y)</span><span class="prop-val" id="insp-h">—</span></div>
      <div class="prop-row"><span class="prop-key">Size (W×D×H)</span><span class="prop-val" id="insp-cm">—</span></div>
      <div class="prop-row"><span class="prop-key">Floor Clear.</span><span class="prop-val" id="insp-y0">—</span></div>
    </div>
    <div class="panel-header">
      <span>Scene Outliner</span>
      <span id="fps-counter" style="font-family:var(--font-mono); font-size:10px; color:#8fd694;">60 FPS</span>
    </div>
    <div id="outliner-container"></div>
  </aside>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { Reflector } from 'three/addons/objects/Reflector.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    // ============================================================================
    // 1. MASTER CONFIGURATION (All real-world metrics in metres; 1 unit = 1 metre)
    // ============================================================================
    const CONFIG = {
      room: {
        width: 4.50,          // X axis (East +X, West -X)
        depth: 4.50,          // Z axis (South +Z, North -Z)
        height: 2.70,         // Y axis (Up +Y)
        wallThickness: 0.15,
        skirtingHeight: 0.08,
        skirtingDepth: 0.015,
        wallColor: '#6B1426', // Deep matte burgundy wine red
        ceilingColor: '#F6F2EA',
        skirtingColor: '#161618',
        plankWidth: 0.18,
        plankLength: 1.20
      },
      window: {
        width: 1.50,          // Along East wall (Z axis)
        height: 1.40,         // Sill 0.80m to Head 2.20m
        sillHeight: 0.80,
        headHeight: 2.20,
        centerZ: -0.50,
        frameThickness: 0.045,
        sillDepth: 0.20,
        sillThickness: 0.035
      },
      carpet: {
        width: 3.20,
        depth: 3.20,
        thickness: 0.015,
        centerX: 0.00,
        centerZ: 0.10,
        color: '#18181B'
      },
      bed: {
        centerX: 0.00,
        northWallZ: -2.25,
        frameWidth: 1.70,
        frameLength: 2.10,
        frameThickness: 0.13,
        plinthInset: 0.06,
        shadowGap: 0.08,      // 0.08m floating gap above floor
        mattressWidth: 1.60,
        mattressLength: 2.00,
        mattressThickness: 0.24, // Top of mattress = 0.08 + 0.13 + 0.24 = 0.45m
        duvetOverhang: 0.25,
        linenColor: '#F4F1EA',
        sleepPillowSize: [0.75, 0.50, 0.14], // W, H, D
        squarePillowSize: [0.40, 0.40, 0.13]
      },
      desk: {
        centerX: 0.00,
        southWallZ: 2.25,
        width: 1.40,
        depth: 0.65,
        height: 0.75,         // Top at 0.75m
        topThickness: 0.03,
        legSize: 0.038,
        macStudioSize: [0.197, 0.095, 0.197],
        monitorPanelSize: [0.62, 0.36, 0.016],
        keyboardSize: [0.279, 0.011, 0.115],
        chairSeatHeight: 0.46,
        chairPosZ: 1.32
      },
      shelf: {
        width: 1.40,
        depth: 0.25,
        thickness: 0.04,
        undersideY: 1.55,     // Clears monitor top (1.25m)
        bookCount: 32,
        bookMinH: 0.18,
        bookMaxH: 0.32,
        bookMinT: 0.02,
        bookMaxT: 0.05
      },
      plant: {
        posX: 1.75,
        posZ: 1.35,
        totalHeight: 1.90,
        vaseHeight: 0.60,
        vaseMaxDiameter: 0.50,
        leafCount: 68,
        leafMinLen: 0.20,
        leafMaxLen: 0.30
      },
      rug: {
        width: 2.00,          // Landscape along West wall (Z axis)
        height: 1.40,         // Vertical (Y axis)
        centerY: 1.50,
        centerZ: -0.40,
        wallOffset: 0.03      // Hangs 0.03m off West wall
      },
      mirror: {
        width: 0.70,
        height: 1.80,
        frameWidth: 0.025,
        frameDepth: 0.032,
        centerZ: 1.45,
        tiltDeg: 6.0          // Leans 6 degrees from vertical against West wall
      },
      human: {
        walkEyeHeight: 1.65,
        figureHeight: 1.75,
        outfitCheckDist: 1.20
      }
    };

    // ============================================================================
    // 2. PROCEDURAL TEXTURE GENERATORS (Zero external assets)
    // ============================================================================
    function createSeededRandom(seed = 42) {
      let s = seed % 2147483647;
      return () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    // Subtle Burgundy Matte Plaster Texture & Bump
    function createBurgundyWallTextures() {
      const size = 512;
      const colorCanvas = document.createElement('canvas');
      const bumpCanvas = document.createElement('canvas');
      colorCanvas.width = bumpCanvas.width = size;
      colorCanvas.height = bumpCanvas.height = size;
      const cCtx = colorCanvas.getContext('2d');
      const bCtx = bumpCanvas.getContext('2d');

      cCtx.fillStyle = CONFIG.room.wallColor;
      cCtx.fillRect(0, 0, size, size);

      const cImg = cCtx.getImageData(0, 0, size, size);
      const bImg = bCtx.createImageData(size, size);
      const rand = createSeededRandom(101);

      for (let i = 0; i < cImg.data.length; i += 4) {
        const n = (rand() - 0.5) * 10;
        cImg.data[i] = Math.min(255, Math.max(0, cImg.data[i] + n));
        cImg.data[i + 1] = Math.min(255, Math.max(0, cImg.data[i + 1] + n * 0.6));
        cImg.data[i + 2] = Math.min(255, Math.max(0, cImg.data[i + 2] + n * 0.7));
        const b = 128 + n * 4;
        bImg.data[i] = bImg.data[i + 1] = bImg.data[i + 2] = b;
        bImg.data[i + 3] = 255;
      }
      cCtx.putImageData(cImg, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      const map = new THREE.CanvasTexture(colorCanvas);
      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      map.repeat.set(3, 2);
      bumpMap.repeat.set(3, 2);
      return { map, bumpMap };
    }

    // Warm Light Oak Floor Planks (0.18m wide x 1.2m long onto 4.5m x 4.5m room)
    function createOakFloorTextures() {
      const w = 1024, h = 1024;
      const canvas = document.createElement('canvas');
      const roughCanvas = document.createElement('canvas');
      const bumpCanvas = document.createElement('canvas');
      canvas.width = roughCanvas.width = bumpCanvas.width = w;
      canvas.height = roughCanvas.height = bumpCanvas.height = h;
      const ctx = canvas.getContext('2d');
      const rCtx = roughCanvas.getContext('2d');
      const bCtx = bumpCanvas.getContext('2d');

      const rand = createSeededRandom(202);
      // Across 4.5m: 25 planks wide (4.5 / 0.18 = 25), 3.75 planks long (4.5 / 1.2 = 3.75)
      const cols = 25;
      const rows = 4;
      const colW = w / cols;
      const rowH = h / rows;

      for (let c = 0; c < cols; c++) {
        const stagger = (c % 2) * (rowH * 0.5);
        for (let r = -1; r <= rows; r++) {
          const x = c * colW;
          const y = r * rowH + stagger;

          const toneShift = (rand() - 0.5) * 22;
          const baseR = 198 + toneShift;
          const baseG = 156 + toneShift * 0.85;
          const baseB = 110 + toneShift * 0.7;

          ctx.fillStyle = `rgb(${baseR|0}, ${baseG|0}, ${baseB|0})`;
          ctx.fillRect(x, y, colW, rowH);

          // Subtle wood grain lines
          for (let g = 0; g < 18; g++) {
            const gx = x + rand() * colW;
            ctx.strokeStyle = `rgba(${(baseR - 22)|0}, ${(baseG - 20)|0}, ${(baseB - 16)|0}, ${0.08 + rand() * 0.10})`;
            ctx.lineWidth = 1 + rand() * 1.6;
            ctx.beginPath();
            ctx.moveTo(gx, y);
            ctx.bezierCurveTo(
              gx + (rand() - 0.5) * 6, y + rowH * 0.33,
              gx + (rand() - 0.5) * 6, y + rowH * 0.66,
              gx + (rand() - 0.5) * 4, y + rowH
            );
            ctx.stroke();
          }

          // Roughness variation per plank
          const rVal = 115 + (rand() - 0.5) * 25;
          rCtx.fillStyle = `rgb(${rVal|0},${rVal|0},${rVal|0})`;
          rCtx.fillRect(x, y, colW, rowH);

          bCtx.fillStyle = '#888';
          bCtx.fillRect(x, y, colW, rowH);

          // Plank seam bevels
          ctx.strokeStyle = 'rgba(65, 45, 28, 0.65)';
          ctx.lineWidth = 1.4;
          ctx.strokeRect(x + 0.5, y + 0.5, colW - 1, rowH - 1);

          bCtx.strokeStyle = '#222';
          bCtx.lineWidth = 2;
          bCtx.strokeRect(x + 0.5, y + 0.5, colW - 1, rowH - 1);
        }
      }

      const map = new THREE.CanvasTexture(canvas);
      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = 8;
      return { map, roughnessMap, bumpMap };
    }

    // Wood Grain Texture (Dark Walnut for Bed Frame / Rod, Warm Oak for Desk / Shelf)
    function createWoodTexture(baseHex, grainHex, seed = 303) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const rand = createSeededRandom(seed);

      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 140; i++) {
        const y = rand() * 512;
        ctx.strokeStyle = grainHex;
        ctx.globalAlpha = 0.06 + rand() * 0.12;
        ctx.lineWidth = 1 + rand() * 3;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(170, y + (rand() - 0.5) * 14, 340, y + (rand() - 0.5) * 14, 512, y + (rand() - 0.5) * 8);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // Warm White Linen Weave + Soft Wrinkle Bump Map for Bedding
    function createLinenTextures() {
      const size = 512;
      const canvas = document.createElement('canvas');
      const bump = document.createElement('canvas');
      canvas.width = bump.width = size;
      canvas.height = bump.height = size;
      const ctx = canvas.getContext('2d');
      const bCtx = bump.getContext('2d');

      ctx.fillStyle = CONFIG.bed.linenColor;
      ctx.fillRect(0, 0, size, size);

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      // Soft wave wrinkles in bump map
      const rand = createSeededRandom(404);
      for (let i = 0; i < 36; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const r = 30 + rand() * 70;
        const grad = bCtx.createRadialGradient(x, y, 2, x, y, r);
        const bright = rand() > 0.5 ? 'rgba(205,205,205,0.18)' : 'rgba(60,60,60,0.18)';
        grad.addColorStop(0, bright);
        grad.addColorStop(1, 'rgba(128,128,128,0)');
        bCtx.fillStyle = grad;
        bCtx.fillRect(0, 0, size, size);
      }

      // Fine linen cross-hatch threads
      ctx.strokeStyle = 'rgba(218, 212, 200, 0.28)';
      ctx.lineWidth = 1;
      for (let i = 0; i < size; i += 3) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
      }

      const map = new THREE.CanvasTexture(canvas);
      const bumpMap = new THREE.CanvasTexture(bump);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      map.repeat.set(4, 4);
      bumpMap.repeat.set(3, 3);
      return { map, bumpMap };
    }

    // Black Low-Pile Wool Carpet Texture
    function createCarpetTextures() {
      const size = 512;
      const canvas = document.createElement('canvas');
      const bump = document.createElement('canvas');
      canvas.width = bump.width = size;
      canvas.height = bump.height = size;
      const ctx = canvas.getContext('2d');
      const bCtx = bump.getContext('2d');
      const img = ctx.createImageData(size, size);
      const bImg = bCtx.createImageData(size, size);
      const rand = createSeededRandom(505);

      for (let i = 0; i < img.data.length; i += 4) {
        const v = 22 + (rand() - 0.5) * 14;
        img.data[i] = v;
        img.data[i + 1] = v;
        img.data[i + 2] = v + 2;
        img.data[i + 3] = 255;

        const bv = 128 + (rand() - 0.5) * 90;
        bImg.data[i] = bImg.data[i + 1] = bImg.data[i + 2] = bv;
        bImg.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      const map = new THREE.CanvasTexture(canvas);
      const bumpMap = new THREE.CanvasTexture(bump);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      map.repeat.set(8, 8);
      bumpMap.repeat.set(10, 10);
      return { map, bumpMap };
    }

    // Intricate Procedural Persian Rug (Central Medallion, Concentric Diamonds, Spandrels, Borders, Wool Pile)
    function createPersianRugTextures() {
      const w = 1024, h = 716; // 2.0m x 1.4m aspect ratio
      const canvas = document.createElement('canvas');
      const bump = document.createElement('canvas');
      canvas.width = bump.width = w;
      canvas.height = bump.height = h;
      const ctx = canvas.getContext('2d');
      const bCtx = bump.getContext('2d');

      const C = {
        navy: '#121E36',
        ivory: '#EFE9DC',
        ochre: '#C9933B',
        teal: '#1F5C63',
        rust: '#9E3828',
        black: '#111115'
      };

      // 1. Base Deep Navy Field
      ctx.fillStyle = C.navy;
      ctx.fillRect(0, 0, w, h);

      // Helper for mirrored drawing across all 4 quadrants
      function drawSymmetrical(fn) {
        [1, -1].forEach(sx => {
          [1, -1].forEach(sy => {
            ctx.save();
            ctx.translate(w / 2, h / 2);
            ctx.scale(sx, sy);
            fn(ctx);
            ctx.restore();
          });
        });
      }

      // 2. Corner Spandrels (Stepped Quarter-Diamonds in Field Corners)
      const pad = 118;
      drawSymmetrical((c) => {
        const cx = w / 2 - pad;
        const cy = h / 2 - pad;
        c.fillStyle = C.rust;
        c.beginPath();
        c.moveTo(cx, cy);
        c.lineTo(cx - 170, cy);
        c.lineTo(cx - 140, cy - 35);
        c.lineTo(cx - 85, cy - 55);
        c.lineTo(cx - 35, cy - 110);
        c.lineTo(cx, cy - 140);
        c.closePath();
        c.fill();
        c.lineWidth = 3;
        c.strokeStyle = C.ivory;
        c.stroke();

        // Inner spandrel teal motif
        c.fillStyle = C.teal;
        c.beginPath();
        c.moveTo(cx, cy);
        c.lineTo(cx - 105, cy);
        c.lineTo(cx, cy - 95);
        c.closePath();
        c.fill();
        c.strokeStyle = C.ochre;
        c.stroke();
      });

      // 3. Repeating Field Arabesque & Floral Motifs
      const rand = createSeededRandom(606);
      drawSymmetrical((c) => {
        c.strokeStyle = C.ochre;
        c.lineWidth = 2;
        for (let x = 40; x < w / 2 - 130; x += 48) {
          for (let y = 35; y < h / 2 - 130; y += 44) {
            // Rosette
            c.fillStyle = (x + y) % 3 === 0 ? C.rust : C.teal;
            c.beginPath();
            c.arc(x, y, 9, 0, Math.PI * 2);
            c.fill();
            c.fillStyle = C.ivory;
            c.beginPath();
            c.arc(x, y, 4, 0, Math.PI * 2);
            c.fill();
            // Connecting vine
            c.beginPath();
            c.moveTo(x, y);
            c.quadraticCurveTo(x + 24, y - 12, x + 28, y + 18);
            c.stroke();
          }
        }
      });

      // 4. Concentric Central Diamond Medallion
      function drawDiamond(rx, ry, fill, stroke, lineW = 4) {
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.beginPath();
        const steps = 16;
        for (let i = 0; i <= steps; i++) {
          const a = (i / steps) * Math.PI * 2;
          const lobe = 1 + 0.08 * Math.cos(a * 8);
          const px = Math.cos(a) * Math.abs(Math.cos(a)) * rx * lobe + Math.cos(a) * rx * 0.35;
          const py = Math.sin(a) * Math.abs(Math.sin(a)) * ry * lobe + Math.sin(a) * ry * 0.35;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = lineW;
        ctx.strokeStyle = stroke;
        ctx.stroke();
        ctx.restore();
      }

      drawDiamond(245, 165, C.ivory, C.black, 5);
      drawDiamond(210, 140, C.rust, C.ochre, 4);
      drawDiamond(155, 102, C.teal, C.ivory, 3);
      drawDiamond(105, 68, C.navy, C.ochre, 3);
      drawDiamond(52, 34, C.ochre, C.ivory, 2);

      // Pendants at East/West ends of the central medallion
      [-285, 285].forEach(dx => {
        ctx.save();
        ctx.translate(w / 2 + dx, h / 2);
        ctx.fillStyle = C.ochre;
        ctx.strokeStyle = C.ivory;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-36, 0); ctx.lineTo(0, -24); ctx.lineTo(36, 0); ctx.lineTo(0, 24);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      // 5. Borders: Outer Guard Stripe, Wide Main Border, Inner Guard Stripe
      function drawBorderRect(inset, thickness, bg, stroke) {
        ctx.lineWidth = thickness;
        ctx.strokeStyle = bg;
        ctx.strokeRect(inset + thickness / 2, inset + thickness / 2, w - (inset + thickness / 2) * 2, h - (inset + thickness / 2) * 2);
        ctx.lineWidth = 2;
        ctx.strokeStyle = stroke;
        ctx.strokeRect(inset, inset, w - inset * 2, h - inset * 2);
        ctx.strokeRect(inset + thickness, inset + thickness, w - (inset + thickness) * 2, h - (inset + thickness) * 2);
      }

      drawBorderRect(0, 16, C.navy, C.black);
      drawBorderRect(16, 22, C.ochre, C.ivory);   // Outer guard stripe
      drawBorderRect(38, 56, C.rust, C.black);    // Wide main border
      drawBorderRect(94, 22, C.teal, C.ivory);    // Inner guard stripe

      // Repeating floral palmettes along the Wide Main Border
      const bMid = 38 + 28;
      for (let x = bMid; x <= w - bMid; x += 36) {
        [bMid, h - bMid].forEach(y => {
          ctx.fillStyle = (x / 36) % 2 === 0 ? C.ivory : C.ochre;
          ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = C.navy;
          ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
        });
      }
      for (let y = bMid + 36; y <= h - bMid - 36; y += 36) {
        [bMid, w - bMid].forEach(x => {
          ctx.fillStyle = (y / 36) % 2 === 0 ? C.ivory : C.teal;
          ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = C.ochre;
          ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
        });
      }

      // 6. Subtle Wool Pile Weave Overlay + Bump
      const cImg = ctx.getImageData(0, 0, w, h);
      const bImg = bCtx.createImageData(w, h);
      for (let p = 0; p < cImg.data.length; p += 4) {
        const idx = p / 4;
        const px = idx % w;
        const py = (idx / w) | 0;
        const weave = ((px % 3 === 0) ^ (py % 3 === 0)) ? 7 : -7;
        const noise = (rand() - 0.5) * 14 + weave;
        cImg.data[p] = Math.min(255, Math.max(0, cImg.data[p] + noise));
        cImg.data[p + 1] = Math.min(255, Math.max(0, cImg.data[p + 1] + noise));
        cImg.data[p + 2] = Math.min(255, Math.max(0, cImg.data[p + 2] + noise));
        const bv = 128 + noise * 3.5;
        bImg.data[p] = bImg.data[p + 1] = bImg.data[p + 2] = bv;
        bImg.data[p + 3] = 255;
      }
      ctx.putImageData(cImg, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      const map = new THREE.CanvasTexture(canvas);
      const bumpMap = new THREE.CanvasTexture(bump);
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = 8;
      return { map, bumpMap };
    }

    // Monitor Dark Gradient Wallpaper & Keyboard Key Grid
    function createMonitorWallpaper() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 288;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 288);
      grad.addColorStop(0, '#0B0F1A');
      grad.addColorStop(0.45, '#1B112C');
      grad.addColorStop(0.8, '#3D1528');
      grad.addColorStop(1, '#101826');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 288);

      // Soft abstract aurora wave (no logos, no text)
      const glow = ctx.createRadialGradient(290, 140, 10, 260, 150, 200);
      glow.addColorStop(0, 'rgba(212, 130, 95, 0.35)');
      glow.addColorStop(0.5, 'rgba(115, 40, 80, 0.18)');
      glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, 512, 288);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createKeyboardTexture() {
      const w = 512, h = 212;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      // Anodized silver chassis
      ctx.fillStyle = '#C8CCD0';
      ctx.fillRect(0, 0, w, h);

      // Recessed key well
      ctx.fillStyle = '#B2B6BA';
      ctx.fillRect(14, 14, w - 28, h - 28);

      // 6 rows of dark chiclet keys (no text)
      const rows = 6;
      const margin = 18;
      const availW = w - margin * 2;
      const availH = h - margin * 2;
      const rowH = availH / rows;

      ctx.fillStyle = '#1E1F22';
      for (let r = 0; r < rows; r++) {
        const y = margin + r * rowH + 2;
        const kh = rowH - 5;
        if (r === 5) {
          // Bottom row with spacebar
          const modifiers = [34, 34, 42, 175, 42, 34, 34, 72];
          let cx = margin;
          modifiers.forEach(mw => {
            ctx.beginPath();
            ctx.roundRect(cx + 2, y, mw - 4, kh, 3);
            ctx.fill();
            cx += mw;
          });
        } else {
          const cols = r === 0 ? 14 : 15;
          const kw = availW / cols;
          for (let c = 0; c < cols; c++) {
            ctx.beginPath();
            ctx.roundRect(margin + c * kw + 2, y, kw - 4, kh, 3);
            ctx.fill();
          }
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    // Fiddle-Leaf Fig Leaf Vein Texture
    function createLeafTextures() {
      const w = 256, h = 384;
      const canvas = document.createElement('canvas');
      const bump = document.createElement('canvas');
      canvas.width = bump.width = w;
      canvas.height = bump.height = h;
      const ctx = canvas.getContext('2d');
      const bCtx = bump.getContext('2d');

      ctx.fillStyle = '#254722';
      ctx.fillRect(0, 0, w, h);
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, w, h);

      // Central midrib vein
      ctx.strokeStyle = '#537A3E';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(w / 2, h);
      ctx.lineTo(w / 2, 14);
      ctx.stroke();

      bCtx.strokeStyle = '#D0D0D0';
      bCtx.lineWidth = 6;
      bCtx.beginPath();
      bCtx.moveTo(w / 2, h);
      bCtx.lineTo(w / 2, 14);
      bCtx.stroke();

      // Lateral herringbone veins
      for (let y = 40; y < h - 30; y += 34) {
        [-1, 1].forEach(dir => {
          ctx.strokeStyle = '#486F35';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(w / 2, y);
          ctx.quadraticCurveTo(w / 2 + dir * 55, y - 8, w / 2 + dir * 105, y - 28);
          ctx.stroke();

          bCtx.strokeStyle = '#B8B8B8';
          bCtx.lineWidth = 3;
          bCtx.beginPath();
          bCtx.moveTo(w / 2, y);
          bCtx.quadraticCurveTo(w / 2 + dir * 55, y - 8, w / 2 + dir * 105, y - 28);
          bCtx.stroke();
        });
      }

      const map = new THREE.CanvasTexture(canvas);
      const bumpMap = new THREE.CanvasTexture(bump);
      map.colorSpace = THREE.SRGBColorSpace;
      return { map, bumpMap };
    }

    // Book Spine Texture Atlas (8 distinct spine styles with stripes/title blocks, zero readable text)
    function createBookSpineTexture(baseColor, stripeColor, seed) {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const rand = createSeededRandom(seed);

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, 64, 256);

      // Top/bottom decorative bands or geometric block
      ctx.fillStyle = stripeColor;
      const pattern = seed % 4;
      if (pattern === 0) {
        ctx.fillRect(8, 28, 48, 36);
        ctx.fillRect(8, 215, 48, 6);
      } else if (pattern === 1) {
        ctx.fillRect(0, 22, 64, 5);
        ctx.fillRect(0, 34, 64, 5);
        ctx.fillRect(14, 70, 36, 52);
        ctx.fillRect(0, 224, 64, 5);
      } else if (pattern === 2) {
        ctx.fillRect(12, 36, 40, 18);
        ctx.beginPath();
        ctx.arc(32, 135, 11, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(10, 24, 44, 8);
        ctx.fillRect(16, 40, 32, 4);
        ctx.fillRect(10, 210, 44, 12);
      }

      // Subtle cloth texture noise
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let y = 0; y < 256; y += 4) {
        if (rand() > 0.5) ctx.fillRect(0, y, 64, 2);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // Soft radial contact shadow texture
    function createContactShadowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 12, 64, 64, 62);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
      grad.addColorStop(0.65, 'rgba(0, 0, 0, 0.22)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    // ============================================================================
    // 3. SCENE, RENDERER & CAMERAS
    // ============================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    RectAreaLightUniformsLib.init();

    const scene = new THREE.Scene();
    scene.name = 'BedroomScene';
    scene.background = new THREE.Color('#141418');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 50);
    camera.position.set(-2.95, 2.25, 2.95);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.2, 0.75, -0.15);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 0.5;
    controls.maxDistance = 11.0;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.update();

    const contactShadowTex = createContactShadowTexture();
    function addContactShadow(parent, w, d, x, y, z, opacity = 0.48) {
      const mat = new THREE.MeshBasicMaterial({
        map: contactShadowTex,
        transparent: true,
        opacity,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, y, z);
      mesh.name = 'ContactShadow';
      mesh.userData.ignorePick = true;
      parent.add(mesh);
      return mesh;
    }

    // Track all inspectable groups/objects for Outliner & Raycaster
    const outlinerGroups = [];
    const pickableObjects = [];
    function registerGroup(group, childrenNames = []) {
      outlinerGroups.push({ group, childrenNames });
    }
    function makePickable(obj, label) {
      if (label) obj.name = label;
      obj.userData.pickable = true;
      pickableObjects.push(obj);
      return obj;
    }

    // ============================================================================
    // 4. BUILD HIERARCHY: ROOM SHELL (Walls, Floor, Ceiling, Skirting, Window, Carpet)
    // ============================================================================
    const roomGroup = new THREE.Group();
    roomGroup.name = 'Room';
    scene.add(roomGroup);

    const { width: RW, depth: RD, height: RH, wallThickness: WT } = CONFIG.room;
    const halfW = RW / 2; // 2.25
    const halfD = RD / 2; // 2.25

    // 4.1 Floor (Top surface at y = 0.000)
    const floorTextures = createOakFloorTextures();
    const floorMat = new THREE.MeshStandardMaterial({
      map: floorTextures.map,
      roughnessMap: floorTextures.roughnessMap,
      bumpMap: floorTextures.bumpMap,
      bumpScale: 0.002,
      roughness: 0.42,
      metalness: 0.02
    });
    const floorMesh = new THREE.Mesh(new THREE.BoxGeometry(RW + WT * 2, 0.04, RD + WT * 2), floorMat);
    floorMesh.position.set(0, -0.02, 0);
    floorMesh.receiveShadow = true;
    makePickable(floorMesh, 'Floor');
    roomGroup.add(floorMesh);

    // 4.2 Matte Burgundy Walls (0.15m thick, window opening cut into East wall)
    const wallsGroup = new THREE.Group();
    wallsGroup.name = 'Walls';
    roomGroup.add(wallsGroup);

    const wallTex = createBurgundyWallTextures();
    const wallMat = new THREE.MeshStandardMaterial({
      map: wallTex.map,
      bumpMap: wallTex.bumpMap,
      bumpScale: 0.0015,
      roughness: 0.86,
      metalness: 0.0
    });

    function createWallPart(name, sx, sy, sz, px, py, pz) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), wallMat);
      m.position.set(px, py, pz);
      m.castShadow = true;
      m.receiveShadow = true;
      m.name = name;
      wallsGroup.add(m);
      return m;
    }

    // North Wall (z = -2.25 to -2.40)
    createWallPart('NorthWall', RW + WT * 2, RH, WT, 0, RH / 2, -halfD - WT / 2);
    // South Wall (z = +2.25 to +2.40)
    createWallPart('SouthWall', RW + WT * 2, RH, WT, 0, RH / 2, halfD + WT / 2);
    // West Wall (x = -2.25 to -2.40)
    createWallPart('WestWall', WT, RH, RD, -halfW - WT / 2, RH / 2, 0);

    // East Wall (x = +2.25 to +2.40) segmented around Window (z = -1.25 to +0.25, y = 0.80 to 2.20)
    const winZMin = CONFIG.window.centerZ - CONFIG.window.width / 2; // -1.25
    const winZMax = CONFIG.window.centerZ + CONFIG.window.width / 2; // +0.25
    const winYMin = CONFIG.window.sillHeight; // 0.80
    const winYMax = CONFIG.window.headHeight; // 2.20
    const eastX = halfW + WT / 2; // 2.325

    // East North Pier (z = -2.25 to -1.25)
    createWallPart('EastWall_NorthPier', WT, RH, winZMin - (-halfD), eastX, RH / 2, (-halfD + winZMin) / 2);
    // East South Pier (z = +0.25 to +2.25)
    createWallPart('EastWall_SouthPier', WT, RH, halfD - winZMax, eastX, RH / 2, (winZMax + halfD) / 2);
    // East Sill Wall (below window y = 0 to 0.80)
    createWallPart('EastWall_BelowWindow', WT, winYMin, CONFIG.window.width, eastX, winYMin / 2, CONFIG.window.centerZ);
    // East Lintel Wall (above window y = 2.20 to 2.70)
    createWallPart('EastWall_AboveWindow', WT, RH - winYMax, CONFIG.window.width, eastX, (winYMax + RH) / 2, CONFIG.window.centerZ);

    makePickable(wallsGroup, 'Walls');

    // 4.3 Ceiling (Hidden by default when orbiting; shadow-blocker roof stays active so sunlight only enters via window)
    const ceilingMat = new THREE.MeshStandardMaterial({
      color: CONFIG.room.ceilingColor,
      roughness: 0.9,
      metalness: 0.0
    });
    const ceilingMesh = new THREE.Mesh(new THREE.BoxGeometry(RW + WT * 2, 0.08, RD + WT * 2), ceilingMat);
    ceilingMesh.position.set(0, RH + 0.04, 0);
    ceilingMesh.receiveShadow = true;
    ceilingMesh.visible = false; // Hidden by default when orbiting
    makePickable(ceilingMesh, 'Ceiling');
    roomGroup.add(ceilingMesh);

    // Invisible shadow-caster roof (blocks directional sun from above even when ceiling is hidden)
    const shadowBlockerMat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
    const shadowRoof = new THREE.Mesh(new THREE.BoxGeometry(RW + WT * 2 + 0.2, 0.05, RD + WT * 2 + 0.2), shadowBlockerMat);
    shadowRoof.position.set(0, RH + 0.08, 0);
    shadowRoof.castShadow = true;
    shadowRoof.userData.ignorePick = true;
    shadowRoof.userData.excludeExport = true;
    roomGroup.add(shadowRoof);

    // 4.4 Skirting Boards (0.08m tall, matte black)
    const skirtingGroup = new THREE.Group();
    skirtingGroup.name = 'Skirting';
    roomGroup.add(skirtingGroup);

    const blackMetalMat = new THREE.MeshStandardMaterial({
      color: CONFIG.room.skirtingColor,
      roughness: 0.55,
      metalness: 0.2
    });
    const skH = CONFIG.room.skirtingHeight;
    const skD = CONFIG.room.skirtingDepth;

    const skN = new THREE.Mesh(new THREE.BoxGeometry(RW, skH, skD), blackMetalMat);
    skN.position.set(0, skH / 2, -halfD + skD / 2);
    const skS = new THREE.Mesh(new THREE.BoxGeometry(RW, skH, skD), blackMetalMat);
    skS.position.set(0, skH / 2, halfD - skD / 2);
    const skW = new THREE.Mesh(new THREE.BoxGeometry(skD, skH, RD), blackMetalMat);
    skW.position.set(-halfW + skD / 2, skH / 2, 0);
    const skE = new THREE.Mesh(new THREE.BoxGeometry(skD, skH, RD), blackMetalMat);
    skE.position.set(halfW - skD / 2, skH / 2, 0);
    skirtingGroup.add(skN, skS, skW, skE);
    makePickable(skirtingGroup, 'Skirting');

    // 4.5 Window (1.5m x 1.4m, sill at 0.8m, 2x2 pane layout, stone sill ledge, deep reveal)
    const windowGroup = new THREE.Group();
    windowGroup.name = 'Window';
    roomGroup.add(windowGroup);

    function updateSkyBackdrop(hour) {
      const t = Math.max(0, Math.min(1, Math.sin(((hour - 6) / 14) * Math.PI)));
      const grad = skyCtx.createLinearGradient(0, 0, 0, 512);
      if (hour < 18.5) {
        grad.addColorStop(0, `rgb(${(110 + t * 45)|0}, ${(165 + t * 45)|0}, ${(225 + t * 25)|0})`);
        grad.addColorStop(0.65, `rgb(${(215 + t * 30)|0}, ${(225 + t * 20)|0}, ${(240 + t * 10)|0})`);
        grad.addColorStop(1, '#F7E6CA');
      } else {
        grad.addColorStop(0, '#0B1021');
        grad.addColorStop(0.6, '#18223D');
        grad.addColorStop(1, '#2B263B');
      }
      skyCtx.fillStyle = grad;
      skyCtx.fillRect(0, 0, 512, 512);

      // Soft procedural clouds
      const cloudAlpha = hour < 18.5 ? 0.55 : 0.08;
      skyCtx.fillStyle = `rgba(255, 250, 244, ${cloudAlpha})`;

        skyCtx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);

      });

      const geo = new RoundedBoxGeometry(w, h, d, 10, 0.045);
      const pos = geo.attributes.position;
      const rand = createSeededRandom(seed);
      const p1 = rand() * 5, p2 = rand() * 5;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);
        const nx = vx / (w / 2);
        const ny = vy / (h / 2);
        // Pinched edges and plump center belly
        const bulge = Math.cos(nx * Math.PI * 0.48) * Math.cos(ny * Math.PI * 0.48);

      const mesh = new THREE.Mesh(geo, whiteLinenMat);
      mesh.castShadow = true;

      return mesh;

    // 8.4 68 Violin-Shaped Fiddle-Leaf Fig Leaves (0.20m to 0.30m) with Veins & Breeze Sway
    function createFiddleLeafGeometry() {
      // Build a realistic violin-shaped ("fiddle") leaf mesh of unit length 1.0 (0 to 1 along +Z)
      const segX = 12, segZ = 20;
      const geo = new THREE.PlaneGeometry(0.68, 1.0, segX, segZ);
      geo.rotateX(-Math.PI / 2);
      geo.translate(0, 0, 0.5); // Base stem at (0,0,0), tip at (0,0,1)

      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vz = pos.getZ(i); // 0..1 along leaf length
        const nx = vx / 0.34;   // -1..1 across width

        // Characteristic fiddle-leaf silhouette: broad lower lobe, pinched waist at z=0.45, broader upper lobe, rounded tip
        const baseTaper = Math.pow(Math.sin(Math.min(1, vz * 1.02) * Math.PI), 0.65);
        const fiddleWaist = 1.0 - 0.28 * Math.exp(-Math.pow((vz - 0.42) / 0.14, 2))
                              + 0.22 * Math.exp(-Math.pow((vz - 0.74) / 0.18, 2));
        const halfWidth = 0.34 * baseTaper * fiddleWaist;
        const newX = nx * halfWidth;

        // Subtle cupping across the midrib + wavy margin ruffles + graceful downward arch
        const cup = Math.abs(nx) * 0.032 * Math.sin(vz * Math.PI);
        const ruffle = Math.sin(vz * 22.0) * 0.012 * Math.pow(Math.abs(nx), 1.5);
        const droop = -Math.pow(vz, 1.85) * 0.11;

        pos.setXYZ(i, newX, cup + ruffle + droop, vz);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const leafTransforms = [];
    for (let i = 0; i < leafCount; i++) {
      const anchor = branchPointsSampled[i % branchPointsSampled.length];
      const len = CONFIG.plant.leafMinLen + randPlant() * (CONFIG.plant.leafMaxLen - CONFIG.plant.leafMinLen);
      const yaw = (i * 2.39996) + (randPlant() - 0.5) * 0.35; // Golden-angle spiral distribution

        Math.sin(yaw) * 0.018,
        (randPlant() - 0.5) * 0.04,
        Math.cos(yaw) * 0.018
      ));

    }

        dummy.scale.setScalar(lt.len);
        dummy.updateMatrix();
        leavesInstanced.setMatrixAt(i, dummy.matrix);

    function updateTimeOfDay(hour) {
      updateSkyBackdrop(hour);

      // Sun elevation & azimuth across the day (06:00 morning to 22:00 night)
      const dayProgress = Math.max(0, Math.min(1, (hour - 6) / 12.5));
      const isDay = hour >= 6.0 && hour <= 18.8;

      if (isDay) {
        const elev = Math.sin(dayProgress * Math.PI); // Peaks mid-day
        const sunX = 5.5 - dayProgress * 2.2;
        const sunY = 1.65 + elev * 2.55;
        const sunZ = -1.9 + dayProgress * 2.4;
        sunLight.position.set(sunX, sunY, sunZ);

        // Color temperature shifts from golden morning to warm daylight to amber sunset
        const warmth = Math.sin(dayProgress * Math.PI);
        sunLight.color.setRGB(1.0, 0.84 + warmth * 0.13, 0.68 + warmth * 0.24);
        sunLight.intensity = 0.8 + Math.pow(elev, 0.55) * 3.1;
        windowRectLight.intensity = 0.6 + elev * 2.3;
        hemiLight.intensity = 0.35 + elev * 0.35;
      } else {
        sunLight.intensity = 0.0;
        windowRectLight.intensity = 0.12;
        windowRectLight.color.set('#3A4F7A');
        hemiLight.intensity = 0.18;
      }

      // Fade in warm interior lights in the evening / night
      const nightFactor = hour > 17.0 ? Math.min(1, (hour - 17.0) / 2.2) : (hour < 7.0 ? (7.0 - hour) / 1.5 : 0);
      shelfWarmLight.intensity = nightFactor * 1.8;
      roomWarmLight.intensity = nightFactor * 2.2;
      bedUnderGlow.intensity = nightFactor * 0.9;
    }
    updateTimeOfDay(9.2);

    // ============================================================================

    const gridHelper = new THREE.GridHelper(CONFIG.room.width, 18, '#D4A359', '#44444C');

    const dimensionSpecs = [

      { text: 'Desk: 140 × 65 × 75 cm', pos: new THREE.Vector3(0.55, 0.82, 1.72) },
      { text: 'Floating Shelf: 140 × 25 × 4 cm (Underside 155 cm)', pos: new THREE.Vector3(0, 1.88, 2.10) },
      { text: 'Fiddle-Leaf Fig: 190 cm (Vase 60 × Ø50 cm)', pos: new THREE.Vector3(1.75, 1.96, 1.35) },
      { text: 'Window: 150 × 140 cm (Sill 80 cm)', pos: new THREE.Vector3(2.18, 1.55, -0.50) },
      { text: 'Persian Rug: 200 × 140 cm (3 cm off wall)', pos: new THREE.Vector3(-2.16, 1.55, -0.40) },
      { text: 'Mirror: 70 × 180 cm (6° tilt)', pos: new THREE.Vector3(-2.10, 1.85, 1.45) },
      { text: 'Black Carpet: 320 × 320 × 1.5 cm', pos: new THREE.Vector3(-1.10, 0.05, 0.90) }
    ];

    const labelsContainer = document.getElementById('labels-container');
    let showDimensions = false;
    const labelElements = dimensionSpecs.map(spec => {
      const el = document.createElement('div');
      el.className = 'dim-label';
      el.textContent = spec.text;
      el.style.display = 'none';
      labelsContainer.appendChild(el);
      return { el, pos: spec.pos };
    });

    function updateDimensionLabels() {
      if (!showDimensions) return;
      const proj = new THREE.Vector3();
      labelElements.forEach(({ el, pos }) => {
        proj.copy(pos).project(camera);
        if (proj.z > 1) {
          el.style.display = 'none';
          return;
        }
        const x = (proj.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-proj.y * 0.5 + 0.5) * window.innerHeight;
        el.style.display = 'block';
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
      });
    }

    // ============================================================================
    // 14. INTERACTIVITY: OUTLINER, OBJECT PICKING, MODES & PRESET CAMERAS
    // ============================================================================
    let selectedObject = null;
    const selectionBox = new THREE.BoxHelper(new THREE.Mesh(), 0xd4a359);
    selectionBox.visible = false;
    selectionBox.userData.ignorePick = true;
    selectionBox.userData.excludeExport = true;
    scene.add(selectionBox);

    function measureObjectWorldBox(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      box.getSize(size);
      return { box, size };
    }

    function selectObject(obj) {
      selectedObject = obj;
      document.querySelectorAll('.tree-item, .tree-header').forEach(el => {
        el.classList.toggle('selected', el.dataset.objName === (obj ? obj.name : ''));
      });

      if (!obj) {
        selectionBox.visible = false;
        document.getElementById('insp-name').textContent = 'None (Click Object)';
        document.getElementById('insp-path').textContent = '—';
        document.getElementById('insp-w').textContent = '—';
        document.getElementById('insp-d').textContent = '—';
        document.getElementById('insp-h').textContent = '—';
        document.getElementById('insp-cm').textContent = '—';
        document.getElementById('insp-y0').textContent = '—';
        return;
      }

      selectionBox.setFromObject(obj);
      selectionBox.visible = true;

      const { box, size } = measureObjectWorldBox(obj);
      const wCm = (size.x * 100).toFixed(1);
      const dCm = (size.z * 100).toFixed(1);
      const hCm = (size.y * 100).toFixed(1);
      const yMinCm = (Math.max(0, box.min.y) * 100).toFixed(1);

      const pathParts = [];
      let cur = obj;
      while (cur && cur !== scene) {
        if (cur.name) pathParts.unshift(cur.name);
        cur = cur.parent;
      }

      document.getElementById('insp-name').textContent = obj.name || 'Object';
      document.getElementById('insp-path').textContent = pathParts.join(' › ');
      document.getElementById('insp-w').textContent = `${wCm} cm (${size.x.toFixed(2)} m)`;
      document.getElementById('insp-d').textContent = `${dCm} cm (${size.z.toFixed(2)} m)`;
      document.getElementById('insp-h').textContent = `${hCm} cm (${size.y.toFixed(2)} m)`;
      document.getElementById('insp-cm').textContent = `${wCm} × ${dCm} × ${hCm} cm`;
      document.getElementById('insp-y0').textContent = `${yMinCm} cm`;
    }

    // Build Collapsible Outliner UI
    const outlinerContainer = document.getElementById('outliner-container');
    function buildOutliner() {
      outlinerContainer.innerHTML = '';
      outlinerGroups.forEach(({ group, childrenNames }) => {
        const groupWrap = document.createElement('div');
        groupWrap.className = 'tree-group';

        const header = document.createElement('div');
        header.className = 'tree-header';
        header.dataset.objName = group.name;
        header.innerHTML = `<span class="caret">▾</span> <span>${group.name}</span>`;

        const childrenWrap = document.createElement('div');
        childrenWrap.className = 'tree-children';

        header.addEventListener('click', (e) => {
          if (e.target.classList.contains('caret')) {
            childrenWrap.classList.toggle('collapsed');
            e.target.textContent = childrenWrap.classList.contains('collapsed') ? '▸' : '▾';
          } else {
            selectObject(group);
          }
        });

        childrenNames.forEach(cName => {
          const childObj = group.getObjectByName(cName);
          if (!childObj) return;
          const item = document.createElement('div');
          item.className = 'tree-item';
          item.dataset.objName = childObj.name;
          const { size } = measureObjectWorldBox(childObj);
          item.innerHTML = `<span>${childObj.name}</span><span style="font-family:var(--font-mono);font-size:9px;opacity:0.65">${(size.x*100)|0}×${(size.z*100)|0}×${(size.y*100)|0}cm</span>`;
          item.addEventListener('click', () => selectObject(childObj));
          childrenWrap.appendChild(item);
        });

        groupWrap.appendChild(header);
        groupWrap.appendChild(childrenWrap);
        outlinerContainer.appendChild(groupWrap);
      });
    }
    buildOutliner();

    // Raycast Object Selection on Click
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (walkMode) return;
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist > 5) return; // Ignore orbit drag

      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(scene.children, true);
      for (const hit of hits) {
        let obj = hit.object;
        if (obj.userData.ignorePick || !obj.visible) continue;
        while (obj && !obj.userData.pickable && obj.parent && obj.parent !== scene) {
          obj = obj.parent;
        }
        if (obj && obj.userData.pickable) {
          selectObject(obj);
          return;
        }
      }
      selectObject(null);
    });

    // Camera Presets & Smooth Transitions
    const CAMERA_PRESETS = {
      overview: { pos: new THREE.Vector3(-2.95, 2.25, 2.95), target: new THREE.Vector3(0.20, 0.75, -0.15) },
      bed:      { pos: new THREE.Vector3(1.55, 1.15, 0.45),  target: new THREE.Vector3(0.00, 0.55, -1.35) },
      desk:     { pos: new THREE.Vector3(-0.95, 1.35, 0.35), target: new THREE.Vector3(0.00, 1.05, 2.05) },
      window:   { pos: new THREE.Vector3(-0.65, 1.45, 0.65), target: new THREE.Vector3(2.25, 1.45, -0.20) },
      mirror:   { pos: new THREE.Vector3(0.25, 1.35, 1.45),  target: new THREE.Vector3(-2.15, 1.00, 1.45) },
      top:      { pos: new THREE.Vector3(0.00, 6.20, 0.01),  target: new THREE.Vector3(0.00, 0.00, 0.00) }
    };

    let camAnim = null;

    // ============================================================================
    // 15. WALK MODE (First-Person WASD + Mouse Look, 1.65m Eye Height, Collision)
    // ============================================================================
    let walkMode = false;
    let walkYaw = 0;
    let walkPitch = 0;
    const moveKeys = { w: false, a: false, s: false, d: false };

    // 2D AABB obstacles in XZ plane for furniture & wall collisions (padded by 0.25m player radius)
    const COLLISION_BOXES = [
      // Bed footprint
      { minX: -0.85 - 0.22, maxX: 0.85 + 0.22, minZ: -2.25, maxZ: -0.15 + 0.22 },
      // Desk footprint
      { minX: -0.70 - 0.22, maxX: 0.70 + 0.22, minZ: 1.60 - 0.22, maxZ: 2.25 },
      // Desk Chair footprint
      { minX: -0.28 - 0.15, maxX: 0.28 + 0.15, minZ: 1.08 - 0.15, maxZ: 1.56 + 0.15 },
      // Statement Plant Vase footprint
      { minX: 1.75 - 0.36, maxX: 1.75 + 0.36, minZ: 1.35 - 0.36, maxZ: 1.35 + 0.36 },
      // Leaning Mirror footprint
      { minX: -2.25, maxX: -1.92, minZ: 1.10 - 0.15, maxZ: 1.80 + 0.15 }
    ];

    function canWalkTo(nx, nz) {
      const wallMargin = 0.26;
      if (nx < -halfW + wallMargin || nx > halfW - wallMargin) return false;
      if (nz < -halfD + wallMargin || nz > halfD - wallMargin) return false;
      for (const b of COLLISION_BOXES) {
        if (nx > b.minX && nx < b.maxX && nz > b.minZ && nz < b.maxZ) return false;
      }
      return true;
    }

    function enterWalkMode() {
      walkMode = true;
      controls.enabled = false;
      ceilingMesh.visible = true; // Show ceiling when inside room in first-person
      document.getElementById('tog-ceiling').classList.add('active');
      document.getElementById('btn-walk').classList.add('active');
      document.getElementById('walk-hud').classList.add('visible');
      document.getElementById('crosshair').style.display = 'block';

      camera.position.set(-0.6, CONFIG.human.walkEyeHeight, 0.55);
      walkYaw = 0.35;
      walkPitch = -0.05;
      renderer.domElement.requestPointerLock?.();
    }

    function exitWalkMode() {
      walkMode = false;
      controls.enabled = true;
      document.getElementById('btn-walk').classList.remove('active');
      document.getElementById('walk-hud').classList.remove('visible');
      document.getElementById('crosshair').style.display = 'none';
      if (document.pointerLockElement) document.exitPointerLock?.();
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      controls.target.copy(camera.position).addScaledVector(forward, 2.0);
    }

    document.getElementById('btn-walk').addEventListener('click', () => {
      if (walkMode) exitWalkMode();
      else enterWalkMode();
    });

    document.addEventListener('pointerlockchange', () => {
      if (!document.pointerLockElement && walkMode) exitWalkMode();
    });

    document.addEventListener('mousemove', (e) => {
      if (!walkMode || document.pointerLockElement !== renderer.domElement) return;
      walkYaw -= e.movementX * 0.0022;
      walkPitch = Math.max(-Math.PI * 0.42, Math.min(Math.PI * 0.42, walkPitch - e.movementY * 0.0022));
    });

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') moveKeys.w = true;
      if (k === 's' || e.key === 'ArrowDown') moveKeys.s = true;
      if (k === 'a' || e.key === 'ArrowLeft') moveKeys.a = true;
      if (k === 'd' || e.key === 'ArrowRight') moveKeys.d = true;
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') moveKeys.w = false;
      if (k === 's' || e.key === 'ArrowDown') moveKeys.s = false;
      if (k === 'a' || e.key === 'ArrowLeft') moveKeys.a = false;
      if (k === 'd' || e.key === 'ArrowRight') moveKeys.d = false;
    });

    // ============================================================================
    // 16. UI TOGGLES, OUTFIT-CHECK MODE & GLB EXPORT
    // ============================================================================
    let swayEnabled = true;
    let wireframeEnabled = false;

    // Outfit-Check Mode (Places 1.75m mannequin 1.2m in front of mirror & snaps camera to mirror view)
    const btnOutfit = document.getElementById('btn-outfit');
    btnOutfit.addEventListener('click', () => {
      const active = !btnOutfit.classList.contains('active');
      btnOutfit.classList.toggle('active', active);
      mannequinGroup.visible = active;
      document.getElementById('tog-human').classList.toggle('active', active);

      if (active) {
        mannequinGroup.position.set(-halfW + 0.15 + CONFIG.human.outfitCheckDist, 0, CONFIG.mirror.centerZ);
        mannequinGroup.rotation.y = -Math.PI / 2;
        animateCameraTo(new THREE.Vector3(-0.35, 1.32, 1.85), new THREE.Vector3(-2.15, 0.95, 1.45));
      }
    });

    document.getElementById('tog-ceiling').addEventListener('click', function () {
      ceilingMesh.visible = !ceilingMesh.visible;
      this.classList.toggle('active', ceilingMesh.visible);
    });

    document.getElementById('tog-grid').addEventListener('click', function () {
      gridHelper.visible = !gridHelper.visible;
      this.classList.toggle('active', gridHelper.visible);
    });

    document.getElementById('tog-wire').addEventListener('click', function () {
      wireframeEnabled = !wireframeEnabled;
      this.classList.toggle('active', wireframeEnabled);
      scene.traverse(obj => {
        if (obj.isMesh && !obj.userData.ignorePick && obj !== mirrorReflector) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.wireframe = wireframeEnabled);
          else if (obj.material) obj.material.wireframe = wireframeEnabled;
        }
      });
    });

    document.getElementById('tog-dims').addEventListener('click', function () {
      showDimensions = !showDimensions;
      this.classList.toggle('active', showDimensions);
      if (!showDimensions) labelElements.forEach(({ el }) => el.style.display = 'none');
    });

    document.getElementById('tog-human').addEventListener('click', function () {
      mannequinGroup.visible = !mannequinGroup.visible;
      this.classList.toggle('active', mannequinGroup.visible);
      if (!mannequinGroup.visible) btnOutfit.classList.remove('active');
    });

    document.getElementById('tog-sway').addEventListener('click', function () {
      swayEnabled = !swayEnabled;
      this.classList.toggle('active', swayEnabled);
    });

    // Time of Day Slider
    const timeSlider = document.getElementById('time-slider');
    const timeReadout = document.getElementById('time-readout');
    timeSlider.addEventListener('input', () => {
      const v = parseFloat(timeSlider.value);
      const hh = Math.floor(v).toString().padStart(2, '0');
      const mm = Math.floor((v % 1) * 60).toString().padStart(2, '0');
      timeReadout.textContent = `${hh}:${mm}`;
      updateTimeOfDay(v);
    });

    // Export GLB (GLTFExporter)
    document.getElementById('btn-export').addEventListener('click', () => {
      const btn = document.getElementById('btn-export');
      btn.textContent = 'Exporting...';

      // Temporarily hide non-standard shader helpers (Reflector, BoxHelper, RectAreaLight) and show Ceiling
      const prevCeiling = ceilingMesh.visible;
      ceilingMesh.visible = true;
      exportGlassMesh.material.opacity = 0.85;

      const hiddenForExport = [];
      scene.traverse(obj => {
        if (obj.userData.excludeExport && obj.visible) {
          obj.visible = false;
          hiddenForExport.push(obj);
        }
      });

      const exporter = new GLTFExporter();
      exporter.parse(
        scene,
        (result) => {
          const blob = new Blob([result], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'procedural_bedroom_1u_1m.glb';
          a.click();
          URL.revokeObjectURL(url);

          // Restore visibility
          ceilingMesh.visible = prevCeiling;
          exportGlassMesh.material.opacity = 0.05;
          hiddenForExport.forEach(o => o.visible = true);
          btn.textContent = 'Export GLB';
        },
        (err) => {
          console.error('GLTF Export Error:', err);
          ceilingMesh.visible = prevCeiling;
          exportGlassMesh.material.opacity = 0.05;
          hiddenForExport.forEach(o => o.visible = true);
          btn.textContent = 'Export GLB';
        },
        { binary: true }
      );
    });

    // ============================================================================
    // 17. CONSOLE DIMENSION VERIFICATION TABLE ON LOAD
    // ============================================================================
    function logDimensionTable() {
      const checks = [
        { name: 'Room Interior Shell', obj: floorMesh, target: '4.50 × 4.50 × 2.70 m' },
        { name: 'Bed > Plinth', obj: plinthMesh, target: '1.58 × 2.04 × 0.08 m (6cm inset)' },
        { name: 'Bed > Frame', obj: frameMesh, target: '1.70 × 2.10 × 0.13 m (Floats at y=0.08m)' },
        { name: 'Bed > Mattress', obj: mattressMesh, target: '1.60 × 2.00 × 0.24 m (Top at y=0.45m)' },
        { name: 'Room > Carpet', obj: carpetMesh, target: '3.20 × 3.20 × 0.015 m' },
        { name: 'DeskSetup > Desk', obj: deskObjGroup, target: '1.40 × 0.65 × 0.75 m' },
        { name: 'DeskSetup > MacStudio', obj: macGroup, target: '0.197 × 0.197 × 0.095 m' },
        { name: 'DeskSetup > Monitor', obj: monitorGroup, target: '0.62 × 0.36 m panel' },
        { name: 'DeskSetup > Keyboard', obj: keyboardMesh, target: '0.279 × 0.115 × 0.011 m' },
        { name: 'DeskSetup > Chair', obj: chairGroup, target: 'Seat height 0.46 m' },
        { name: 'BookShelf > Shelf', obj: shelfMesh, target: '1.40 × 0.25 × 0.04 m (Underside y=1.55m)' },
        { name: 'StatementPlant (Total)', obj: plantGroup, target: '~1.90 m tall' },
        { name: 'StatementPlant > Vase', obj: vaseMesh, target: 'Ø0.50 × 0.60 m tall' },
        { name: 'Room > Window', obj: windowGroup, target: '1.50 × 1.40 m (Sill y=0.80m)' },
        { name: 'PersianRug > Tapestry', obj: tapestryMesh, target: '2.00 × 1.40 m (3cm off wall)' },
        { name: 'Mirror > Frame', obj: mirrorGroup, target: '0.70 × 1.80 m (6° tilt)' }
      ];

      const rows = checks.map(c => {
        const { box, size } = measureObjectWorldBox(c.obj);
        return {
          Object: c.name,
          Target_Spec: c.target,
          Measured_W_X_m: Number(size.x.toFixed(3)),
          Measured_D_Z_m: Number(size.z.toFixed(3)),
          Measured_H_Y_m: Number(size.y.toFixed(3)),
          Bottom_Y_m: Number(box.min.y.toFixed(3)),
          Top_Y_m: Number(box.max.y.toFixed(3))
        };
      });

      console.log('%c[3D BEDROOM SCALE VERIFICATION — 1 unit = 1 metre]', 'color:#d4a359;font-weight:bold;font-size:13px;');
      console.table(rows);
    }
    logDimensionTable();

    // ============================================================================
    // 18. MAIN ANIMATION LOOP (60fps, Camera Transitions, Walk Physics, Sway)
    // ============================================================================
    let prevTime = performance.now();
    let frameCount = 0;
    let fpsTimer = prevTime;
    const fpsEl = document.getElementById('fps-counter');

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min(0.1, (now - prevTime) / 1000);
      prevTime = now;

      // FPS Counter
      frameCount++;
      if (now - fpsTimer >= 500) {
        const fps = Math.round((frameCount * 1000) / (now - fpsTimer));
        fpsEl.textContent = `${fps} FPS`;
        frameCount = 0;
        fpsTimer = now;
      }

      // Smooth Camera Preset Transition
      if (camAnim) {
        const t = Math.min(1, (now - camAnim.startTime) / camAnim.duration);
        const ease = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
        controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
        controls.update();
        if (t >= 1) camAnim = null;
      } else if (walkMode) {
        // First-Person Walk Mode Physics
        camera.rotation.set(walkPitch, walkYaw, 0, 'YXZ');
        const speed = 2.1 * dt;
        const forward = new THREE.Vector3(-Math.sin(walkYaw), 0, -Math.cos(walkYaw));
        const right = new THREE.Vector3(Math.cos(walkYaw), 0, -Math.sin(walkYaw));
        const moveVec = new THREE.Vector3();
        if (moveKeys.w) moveVec.add(forward);
        if (moveKeys.s) moveVec.sub(forward);
        if (moveKeys.d) moveVec.add(right);
        if (moveKeys.a) moveVec.sub(right);

        if (moveVec.lengthSq() > 0) {
          moveVec.normalize().multiplyScalar(speed);
          const nextX = camera.position.x + moveVec.x;
          const nextZ = camera.position.z + moveVec.z;
          if (canWalkTo(nextX, camera.position.z)) camera.position.x = nextX;
          if (canWalkTo(camera.position.x, nextZ)) camera.position.z = nextZ;
        }
        camera.position.y = CONFIG.human.walkEyeHeight;
      } else {
        controls.update();
      }

      // Fiddle-Leaf Fig Breeze Animation
      if (swayEnabled) {
        updateLeavesSway(now * 0.001, true);
      }

      if (selectionBox.visible && selectedObject) {
        selectionBox.update();
      }

      updateDimensionLabels();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
